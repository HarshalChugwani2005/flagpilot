name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      # No secrets in CI: tests marked "integration" skip themselves without keys.
      - name: Pytest
        run: pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Demo store tests
        run: node --test tests/test_demo_store.mjs
