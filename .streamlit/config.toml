# No `base`: Streamlit follows the viewer's OS light/dark setting, and FlagPilot's CSS,
# pills and charts adapt to both. Replace with the playbook's UI-design theme when available.
[theme]
primaryColor = "#7C5CFF"
font = "sans serif"
baseRadius = "medium"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# FlagPilot shows its own friendly errors; never show raw tracebacks to users.
showErrorDetails = "none"
