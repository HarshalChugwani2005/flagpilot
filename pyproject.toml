[project]
name = "flagpilot"
version = "0.1.0"
description = "AI agent that turns plain-English requests into human-approved Flagsmith A/B experiments."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
